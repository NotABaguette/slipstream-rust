name: Build Matrix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_ext: ""
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""
          - name: macos-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bin_ext: ""
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
          - name: windows-x86
            runner: windows-latest
            target: i686-pc-windows-msvc
            bin_ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev python3
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Linux ARM64 cross linker
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build binaries
        run: |
          cargo build -p slipstream-client -p slipstream-server \
            --release \
            --target ${{ matrix.target }} \
            --features openssl-vendored

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/slipstream-client" "dist/slipstream-client"
          cp "target/${{ matrix.target }}/release/slipstream-server" "dist/slipstream-server"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum slipstream-client slipstream-server > checksums.sha256)
          else
            (cd dist && shasum -a 256 slipstream-client slipstream-server > checksums.sha256)
          fi

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/slipstream-client.exe" "dist/slipstream-client.exe"
          cp "target/${{ matrix.target }}/release/slipstream-server.exe" "dist/slipstream-server.exe"
          certutil -hashfile dist/slipstream-client.exe SHA256 | sed '1d;$d' | tr -d ' \r' > client.sha256
          certutil -hashfile dist/slipstream-server.exe SHA256 | sed '1d;$d' | tr -d ' \r' > server.sha256
          {
            printf "%s  %s\n" "$(cat client.sha256)" "slipstream-client.exe"
            printf "%s  %s\n" "$(cat server.sha256)" "slipstream-server.exe"
          } > dist/checksums.sha256
          rm -f client.sha256 server.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
